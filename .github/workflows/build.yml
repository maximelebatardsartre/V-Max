name: Build et tests

on:
  push:
    branches: [main, "vmax/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilation (x64)
        run: dotnet build VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -c Release -p:Platform=x64 -nologo
      - name: Tests
        run: dotnet test tests/VMax.Tests/VMax.Tests.csproj -c Release -p:Platform=x64 -nologo --logger "trx;LogFileName=tests.trx"
      - name: Traductions françaises
        run: python tools/i18n/check_lang.py fr
      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: tests/**/TestResults/*.trx
